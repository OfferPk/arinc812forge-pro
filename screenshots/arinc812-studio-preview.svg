  <text x="85" y="55" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">ARINC 812</text>
  <text x="150" y="55" fill="#ffffff" font-size="16" font-weight="bold">ARINC812Forge Pro — Galley Insert &amp; GNC Studio</text>
  
  <rect x="710" y="32" width="250" height="36" rx="18" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" />
