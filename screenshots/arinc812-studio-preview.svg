  <text x="420" y="583" fill="#94a3b8" font-size="11">Feeder B</text>
  <text x="520" y="583" fill="#34d399" font-size="11" font-family="monospace">2.60 kVA</text>
  <text x="610" y="583" fill="#38bdf8" font-size="11">Priority 4</text>
